name: Bug report
description: Runesmith, a built-in plugin or the plugin API does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem, ideally with a small file or folder that shows it. If Runesmith crashed, attach the log from the folder Help > About names.
      placeholder: |
        1. Open a folder with a C# project.
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version Help > About shows, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
