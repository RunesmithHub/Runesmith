# Builds the solution and runs the tests on Linux and Windows, on each pull request and each push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test on ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            os: linux
            runner: ubuntu-24.04
          - system: Windows
            os: windows
            runner: windows-2025
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Runesmith.slnx -warnaserror

      # Projects without tests run none, which the test platform reports with exit code 8.
      - name: Test
        run: >-
          dotnet test --solution Runesmith.slnx --no-build --results-directory TestResults --
          --ignore-exit-code 8 --report-xunit-trx --hangdump --hangdump-timeout 10m --hangdump-type Mini

      - name: Summarize the tests
        if: ${{ !cancelled() }}
        run: dotnet run .github/scripts/TestSummary.cs -- TestResults

      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 14
          if-no-files-found: ignore
