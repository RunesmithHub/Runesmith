# When a version tag such as v0.2.0 is pushed: publishes Runesmith for each platform with the plugins bundled-plugins.json pins, creates a
# GitHub release with the archives, and pushes the plugin SDK, text, language and template packages to the plugin hub's feed. A tag such
# as sdk/v0.2.0 pushes only the packages. Pull requests that change this workflow, the app, the bundled plugins or the build targets, and
# runs on demand, build everything without releasing it.
name: Release

on:
  push:
    tags: ["v*", "sdk/v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src/Runesmith.App/**
      - bundled-plugins.json
      - tools/**
      - Directory.Build.targets
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish for ${{ matrix.rid }}
    if: ${{ !startsWith(github.ref, 'refs/tags/sdk/') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: win-x64
            runner: windows-2025
          - rid: osx-arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # MSBuild reads RunesmithVersion from the environment.
      - name: Take the version from the tag
        run: |
          base=$(dotnet msbuild src/Runesmith.App -getProperty:RunesmithVersion)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="$base-ci.$GITHUB_RUN_NUMBER"; fi
          echo "RunesmithVersion=$version" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish src/Runesmith.App --configuration Release --runtime ${{ matrix.rid }} --self-contained --output "artifacts/runesmith" -warnaserror

      - name: Check that the output has every bundled plugin and no other
        run: |
          pinned=$(jq -r ".plugins[].id" bundled-plugins.json | tr -d "\r")
          for id in $pinned; do
            if [[ ! -f "artifacts/runesmith/plugins/$id/plugin.json" ]]; then echo "::error::The published app has no plugins/$id."; exit 1; fi
          done
          for folder in artifacts/runesmith/plugins/*/; do
            id=$(basename "$folder")
            if ! grep -qx "$id" <<< "$pinned"; then echo "::error::The published app has plugins/$id, which bundled-plugins.json does not pin."; exit 1; fi
          done

      - name: Archive
        env:
          RID: ${{ matrix.rid }}
        run: |
          name="runesmith-$RunesmithVersion-$RID"
          cd artifacts
          if [[ "$RID" == win-* ]]; then 7z a -tzip "$name.zip" runesmith > /dev/null; else tar -czf "$name.tar.gz" runesmith; fi

      - name: Upload the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runesmith-${{ matrix.rid }}
          path: artifacts/runesmith-*
          retention-days: 7
          if-no-files-found: error

  packages:
    name: Pack the plugin SDK, language and template packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Take the version from the tag
        run: |
          base=$(dotnet msbuild src/Runesmith.Sdk -getProperty:RunesmithVersion)
          case "$GITHUB_REF" in
            refs/tags/sdk/v*) version="${GITHUB_REF_NAME#sdk/v}" ;;
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="$base-ci.$GITHUB_RUN_NUMBER" ;;
          esac
          echo "RunesmithVersion=$version" >> "$GITHUB_ENV"

      # Plugins build against the SDK package, which depends on the text package, and the language plugins against the language engines;
      # the template creates such plugins.
      - name: Pack
        run: |
          for project in Runesmith.Text Runesmith.Sdk Runesmith.LanguageServices Runesmith.Languages.Java.Syntax Runesmith.Languages.Java Runesmith.Languages.CSharp; do
            dotnet pack "src/$project" --configuration Release --output artifacts/packages -warnaserror
          done
          dotnet pack templates/Runesmith.Templates --configuration Release --output artifacts/packages -warnaserror

      # Plugins restore Runesmith.Sdk, and through it Runesmith.Text, from the hub feed, and plugin authors install the template from it.
      - name: Upload the SDK packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-packages
          path: |
            artifacts/packages/Runesmith.Sdk.*.nupkg
            artifacts/packages/Runesmith.Text.*.nupkg
            artifacts/packages/Runesmith.LanguageServices.*.nupkg
            artifacts/packages/Runesmith.Languages.*.nupkg
            artifacts/packages/Runesmith.Templates.*.nupkg
          retention-days: 7
          if-no-files-found: error

  hub-feed:
    name: Push the packages to the hub feed
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/sdk/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: hub-feed
    permissions:
      contents: read
    steps:
      - name: Download the SDK packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-packages
          path: packages

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Install Sleet
        run: dotnet tool install sleet --version 7.2.0 --tool-path "$RUNNER_TEMP/tools"

      # Holds the bucket keys, so it lives outside the workspace and is removed after the push.
      - name: Write the Sleet configuration
        env:
          HUB_FEED_ACCOUNT_ID: ${{ vars.HUB_FEED_ACCOUNT_ID }}
          HUB_FEED_BUCKET: ${{ vars.HUB_FEED_BUCKET }}
          HUB_FEED_ACCESS_KEY_ID: ${{ secrets.HUB_FEED_ACCESS_KEY_ID }}
          HUB_FEED_SECRET_ACCESS_KEY: ${{ secrets.HUB_FEED_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          jq -n \
            --arg serviceURL "https://$HUB_FEED_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --arg bucketName "$HUB_FEED_BUCKET" \
            --arg accessKeyId "$HUB_FEED_ACCESS_KEY_ID" \
            --arg secretAccessKey "$HUB_FEED_SECRET_ACCESS_KEY" \
            '{sources: [{name: "hub-feed", type: "s3", serviceURL: $serviceURL, bucketName: $bucketName, disablePayloadSigning: true,
              path: "https://nuget.runesmith.dev/", baseURI: "https://nuget.runesmith.dev/", accessKeyId: $accessKeyId, secretAccessKey: $secretAccessKey}]}' \
            > "$RUNNER_TEMP/sleet.json"

      # Versions already on the feed are skipped, never overwritten, so a re-run finishes what a failed run started.
      - name: Push to the hub feed
        # R2 rejects the whole-object checksums the AWS SDK adds to multipart uploads.
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: '"$RUNNER_TEMP/tools/sleet" push packages --config "$RUNNER_TEMP/sleet.json" --source hub-feed --skip-existing'

      - name: Remove the Sleet configuration
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/sleet.json"

  release:
    name: Create the release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: archives
          merge-multiple: true

      # A tag with a pre-release part, such as v0.3.0-rc.1, makes a pre-release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" archives/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Runesmith $version" --generate-notes "${prerelease[@]}"
